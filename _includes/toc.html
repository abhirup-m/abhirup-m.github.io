{% assign html = include.content | jsonify | remove: '\"' | split: "\n" %}
<ul>
{% for line in html %}
{% assign start = line | strip | slice:0, 7 %}
{% if start == '<h2 id=' %}
	{% assign id = line | remove_first: '<h2 id=' | split: ">" | first | strip_html %}
	{% assign heading = line | split: "</h2>" | first | strip_html %}
	<li><a href={{ id | prepend: '#' }}>{{ heading }}</a></li>
{% endif %}
{% endfor %}
</ul>
