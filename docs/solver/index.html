	<main>
	<h1> Seeing the Schrödinger Equation </h1>

<div class="potential-box">
  <p><label>Potential V(x): </label><input type="text" id="potential" placeholder="Functional form of the potential. Eg., x**2, sin(x), abs(x), etc" /></p>
</div>
<div class="potential-box">
  <p><span><label>Left edge: </label><input type="number" value="-10" id="xlimMin" placeholder="Position of left boundary of the system." /></span>
<span><label>Right edge: </label><input type="number" value="10" id="xlimMax" placeholder="Position of right boundary of the system." /></span></p>
</div>

<p><button type="button" id="run" class="apply-potential">SOLVE FOR GROUND STATE</button></p>

<div id="plot"></div>

<script type="module">
import { runSolver } from "/assets/solver/solver.js";

document.getElementById("run").onclick = async () => {
  const potential = document.getElementById("potential").value;
  const xmin = document.getElementById("xlimMin").value;
  const xmax = document.getElementById("xlimMax").value;
  runSolver(potential, xmin, xmax, (xmax - xmin)/1000);
};
</script>
